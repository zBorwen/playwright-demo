# ============================================================
# playwright-demo Project Ontology — 项目唯一事实源（Single Source of Truth）
#
# 所有项目文档（README/CLAUDE/GEMINI/AGENTS/TESTING/DEPLOYMENT）由本文件生成，
# 所有代码校验规则亦由本文件驱动。
#
# 修改约束的正确姿势：
#   1. 编辑本文件
#   2. pnpm docs:gen        # 重新生成全部文档
#   3. pnpm ontology:check  # 校验代码是否符合规则
#   4. 提交
#
# 禁止直接编辑任何生成的 .md 文件（它们带自动生成标记）。
# ============================================================

# ---------- 元信息 ----------
meta:
  title: playwright-demo Project Ontology
  version: 1.0.0
  description: >-
    项目唯一事实源。所有项目文档与代码校验规则均由本本体派生。
    修改约束请编辑此文件，然后运行 pnpm docs:gen 与 pnpm ontology:check。
  generated:            # 由本本体生成的文档清单
    - README.md
    - CLAUDE.md
    - GEMINI.md
    - AGENTS.md
    - TESTING.md
    - DEPLOYMENT.md
  principles:           # 本体的核心原则（公理）
    - 一切项目知识都有一处事实源，其余均为派生视图
    - 规则必须可执行（enforceable），而非仅靠模型自觉
    - 文档由本体生成，禁止手工编辑生成物
    - 本体变更 → 重新生成 → 校验代码 → 提交

# ---------- 类（概念） ----------
classes:
  Package:
    description: pnpm workspace 中的独立包
    individuals: [shared, agent, server, frontend]
  Document:
    description: 项目文档，均为本体生成物
    individuals: [README.md, CLAUDE.md, GEMINI.md, AGENTS.md, TESTING.md, DEPLOYMENT.md]
  Rule:
    description: 约束规则（可执行或指导性）
    individuals: []
  Commit:
    description: Git 提交
    individuals: []
  Branch:
    description: Git 分支
    individuals: []
  Plugin:
    description: AI 编码工具插件
    individuals: [playwright, typescript-lsp, context7, superpowers, frontend-design, github]
  Test:
    description: 测试用例与测试策略
    individuals: []
  Architecture:
    description: 系统架构元素
    individuals: [Frontend, Server, Agent, Shared]

# ---------- 属性（数据属性 / 约束事实） ----------
properties:
  # 语言规范
  language:
    default: zh-CN
    rules:
      - 所有由 AI 生成或修改的文档、代码注释、提交信息等，默认使用中文编写
      - 与用户交流默认使用中文
      - 各领域专有词汇按原语言保留

  # 环境约定
  environment:
    node: ">= 24"
    nodeNote: 可直接运行 .ts 文件，无需 tsc 或 ts-node
    packageManager: pnpm
    postgres: ">= 15"

  # 命名规则（含惯例例外）
  naming:
    variable: camelCase          # 变量
    function: camelCase          # 函数
    class: PascalCase            # 类
    interface: PascalCase        # 接口
    constant: UPPER_SNAKE_CASE   # 常量
    file: kebab-case             # 文件
    directory: kebab-case        # 目录
    avoidAbbreviations: true     # 避免缩写（广泛认可的除外）
    functionVerb: 函数用动词或动宾短语
    classNoun: 类用名词
    booleanPrefix: bool 用 is/has/can 开头
    iconComponent: 图标组件使用 SaveIcon 而非 Save，避免歧义
    functionDecl: 函数声明用 function handleXXX() {}，不用 const handleXXX = () => {}
    noInlineSvg: 不内嵌 SVG，使用第三方图标库（如 lucide）
    # 命名例外（惯例豁免——例外也是知识，必须记录理由）
    exceptions:
      reactComponent: React 组件（含 .tsx 中的组件函数与组件文件）使用 PascalCase，这是行业惯例
      zodSchema: Zod schema 变量使用 PascalCase（如 ClickActionSchema），这是项目惯例
      testFile: 测试文件名允许 .test / .spec 后缀（如 actions.test.ts）
      configFile: 构建/工具配置文件允许 *.config.* 命名（如 vite.config.ts、tailwind.config.ts），这是生态惯例
      testLines: 测试文件（__tests__ 目录）不受行数上限约束，行数上限针对组件/库/脚本
      builtin: Node 内建（__dirname 等）与下划线前缀哨兵（_exhaustive）豁免
      asExpression: TS 语法（type as string 等）不参与命名检查
      historicalCommit: 历史提交不合规仅作债务记录（warning），新提交必须合规

  # 规模上限
  limits:
    maxLinesPerFile: 400        # 单文件行数上限
    preferredLinesPerFile: 300  # 建议行数
    commitSubjectMaxChars: 50   # 提交描述字数上限

  # 代码规范
  code:
    language: TypeScript
    typesComplete: true         # 类型写完整
    noAny: true                 # 禁止 any
    noJsdoc: 不使用 JSDoc，依赖 TypeScript 类型系统

# ---------- 关系（对象属性） ----------
relations:
  # 包依赖关系（dependency-boundary 规则的数据源）
  dependsOn:
    shared: []
    agent: [shared]
    server: [shared]
    frontend: [shared]
  # 通信关系（WebSocket）
  communicatesWith:
    frontend: [server]
    server: [frontend, agent]
    agent: [server]
  # 包含关系（职责描述）
  contains:
    shared: [Zod schema, 类型定义]
    server: [REST API, WebSocket 网关, PostgreSQL 持久化]
    agent: [playwright-core 录制/回放, 元素指纹, Mock 路由, Worker Pool]
    frontend: [React UI, 录制器, 回放面板, Mock 配置, Dashboard]

# ---------- 规则（公理） ----------
# enforceable: 是否可执行（有 checker 的才是硬规则）
# exemptions:  豁免路径（glob），豁免必须可解释——理由见 properties.naming.exceptions
rules:
  - id: language.zh
    description: 所有 AI 产物（文档、注释、提交信息）默认中文
    enforceable: false
    appliesTo: [Document, Commit]

  - id: env.node24
    description: Node.js >= 24，直接运行 .ts
    enforceable: false
    appliesTo: [Package]

  - id: code.ts-complete-types
    description: TypeScript 类型写完整，禁止 any
    enforceable: true
    checker: no-any
    exemptions: ["**/__tests__/**"]   # 测试 mock 与断言需要宽松类型
    appliesTo: [Package]

  - id: code.no-jsdoc
    description: 不使用 JSDoc，依赖 TypeScript 类型系统
    enforceable: false
    appliesTo: [Package]

  - id: naming.standard
    description: 命名遵循 properties.naming 表（含 exceptions 惯例豁免）
    enforceable: true
    checker: naming
    exemptions: ["**/__tests__/**"]   # 测试代码允许自由命名
    appliesTo: [Package]

  - id: size.max-lines
    description: 单组件/库/脚本不超过 400 行，尽量控制在 300 行附近
    enforceable: true
    checker: max-lines
    exemptions: ["**/__tests__/**"]   # 测试文件不受行数上限约束
    appliesTo: [Package]

  - id: git.commit-format
    description: "提交信息：中文，格式 `<类型>: <简短描述>`，类型 feat/fix/docs/refactor/test/chore，描述 ≤ 50 字，只说做了什么不说怎么做"
    enforceable: true
    checker: commit-format
    appliesTo: [Commit]

  - id: git.branch-model
    description: "主分支 main 保持稳定；功能分支 `<类型>/<简短描述>`；完成后合并回 main，避免直接 push"
    enforceable: false
    appliesTo: [Branch]

  - id: git.pr-format
    description: PR 标题与提交信息格式一致；正文包含做了什么、为什么、如何验证；合并后删除远程功能分支
    enforceable: false
    appliesTo: [Commit]

  - id: dependency.boundary
    description: 包间依赖必须符合 relations.dependsOn
    enforceable: true
    checker: dependency-boundary
    appliesTo: [Package]

  - id: security.no-env-access
    description: 不访问项目内的 .env 文件；如需涉及 .env 的操作，编写脚本交由用户手动执行
    enforceable: false
    appliesTo: [Package]

# ---------- 流程 ----------
process:
  # 开发流程
  devFlow:
    - 拿到任务 → 做计划、分解 todo → 写入 WIP.md
    - 针对目标编写测试用例
    - 逐项完成 todo，确保测试通过
    - 需要时记录文档
    - 验收完成后清理文档，重要事项并入常规文档
  # 本体维护流程
  ontologyFlow:
    - 修改约束 → 编辑 ontology/project-ontology.yaml
    - 重新生成文档 → pnpm docs:gen
    - 校验代码 → pnpm ontology:check
    - 提交

# ---------- 项目知识 ----------
knowledge:
  project:
    title: playwright-demo
    subtitle: 基于 Playwright 的浏览器自动化可视化系统 / E2E 测试平台
    description: >-
      通过 Web 界面录制用户操作，回放时支持 Mock 模式，替代脆弱的 Selenium/Puppeteer 脚本。
      已实现录制、回放、Mock、代码生成、批量回放等核心功能。
    architecture:
      - "┌─────────────┐      WebSocket      ┌─────────────┐"
      - "│   Frontend  │ ◄─────────────────► │   Server    │"
      - "│  React+TW   │                     │  Hono+PG    │"
      - "└─────────────┘                     └──────┬──────┘"
      - "                                           │ WebSocket"
      - "                                    ┌──────▼──────┐"
      - "                                    │   Agent     │"
      - "                                    │ playwright  │"
      - "                                    └─────────────┘"
    features:
      - 可视化录制 — 输入目标 URL → 点击录制 → 本地控制浏览器操作自动捕获
      - 语义化存储 — 操作序列存为 JSON + HAR 网络数据 + 元素指纹
      - Mock 回放 — 支持真实 API / HAR Mock 两种回放模式
      - 元素指纹 — 采集 data-testid、role、accessibleName 等用于 AI 自愈合
      - 实时 WebSocket — 录制/回放过程实时推送到前端
    quickstart:
      - pnpm install
      - cd packages/server && pnpm db:push   # 初始化数据库
      - cd packages/server && pnpm dev       # http://localhost:3000
      - cd packages/frontend && pnpm dev     # http://localhost:5173
      - cd packages/agent && SERVER_URL=ws://localhost:3000/ws pnpm start

  # 技术栈
  techStack:
    Monorepo: pnpm workspace
    Server: Hono + PostgreSQL + Drizzle ORM + ws
    Agent: playwright-core + ws
    Frontend: React 19 + Tailwind CSS (zinc dark) + Zustand + react-router-dom
    Shared: Zod schemas

  # 测试知识
  testing:
    commands:
      - pnpm -r test    # 全部测试
      - cd packages/shared && pnpm test
      - cd packages/agent && pnpm test
      - cd packages/server && pnpm test
      - cd packages/frontend && pnpm test
    strategy:
      shared: Schema 验证：输入合法/非法、默认值、类型推断，覆盖率 100%
      agent: 单元测试：Fingerprint JS、HAR 解析、MockRule 匹配逻辑
      server: 单元测试：路由请求/响应（mock 数据库），路由逻辑覆盖率 80%+
      frontend: 组件/工具函数测试
      replayEngine: 集成测试（需要浏览器，CI 中用 Playwright 的 docker 镜像）

  # 部署知识
  deployment:
    requirements:
      - Node.js >= 24
      - PostgreSQL >= 15
      - pnpm >= 9
    env:
      server:
        PORT: "3000"
        DATABASE_URL: postgres://localhost:5432/playwright_demo
        STORAGE_PATH: ./storage
      agent:
        SERVER_URL: ws://localhost:3000/ws
        AGENT_TOKEN: —（可选）
      frontend:
        VITE_API_URL: /api
    localDev:
      - pnpm install
      - cd packages/server && pnpm db:push
      - cd packages/server && pnpm dev   # http://localhost:3000
      - cd packages/frontend && pnpm dev # http://localhost:5173
      - cd packages/agent && pnpm start  # WebSocket → localhost:3000
    production:
      - 构建 server 与 frontend（pnpm build）
      - frontend dist/ 部署到静态服务器（Nginx 或 Node）
      - server 使用 node packages/server/src/index.ts 运行
      - Docker 多阶段构建：node:24-alpine（server）+ nginx:alpine（frontend）

# ---------- 文档定义（本体 → 文档的映射） ----------
# template 决定生成器使用哪个渲染模板：
#   readme / constraints / agents / testing / deployment
# agent 字段仅 constraints 模板使用，用于区分 CLAUDE 与 GEMINI 版本
documents:
  README.md:
    purpose: 项目描述和使用指南
    template: readme
  CLAUDE.md:
    purpose: 项目级别约束：技术栈、命名规范、开发流程、安全规则等
    template: constraints
    agent: claude
  GEMINI.md:
    purpose: 项目级别约束（Gemini 版本，与 CLAUDE.md 同源生成）
    template: constraints
    agent: gemini
  AGENTS.md:
    purpose: 代理推理风格：分析问题的方法、输出格式、系统思维框架
    template: agents
  TESTING.md:
    purpose: 测试指南（运行方式、覆盖率要求）
    template: testing
  DEPLOYMENT.md:
    purpose: 部署指南
    template: deployment
